# Example ConfigMap: Netris Fabric Manager registration (network manager
# integration contract §4.2).
#
# The operator finds a manager by data.name and the manager-type label
# osac.openshift.io/network-fabric-manager, in the operator's namespace.
# Registrations are immutable: to change one, delete it and create a new one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-network-fabric-manager-netris
  namespace: osac
  labels:
    osac.openshift.io/network-fabric-manager: "true"
immutable: true
data:
  # The value NetworkClass.fabric_manager selects.
  name: netris
  # Fully qualified role that holds the task files.
  ansible_role: osac.templates.netris
  # Network types the fabric serves (comma-separated, no spaces).
  network_types: evpn
  # Capabilities (comma-separated, no spaces): eastWestEthernet is the only one.
  capabilities: eastWestEthernet
  description: Netris SDN controller for the physical fabric.
