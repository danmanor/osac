{{- /*
Registration of OSAC's Kubernetes Manager cudn_evpn (network manager contract
§4.2). Registrations are immutable, so the ConfigMap name carries a hash of
its data: a release that changes the data replaces the ConfigMap instead of
patching it. Fabric Manager registrations are not rendered here; the Cloud
Infrastructure Admin (or the installer, for the Fabric Managers OSAC ships)
creates them. It is always rendered: the operator chart is the only source
of this registration.
*/ -}}
{{- $data := dict "name" "cudn_evpn" "ansible_role" "osac.templates.cudn_evpn" "network_type" "evpn" "description" "OSAC Kubernetes Manager: one ClusterUserDefinedNetwork with an EVPN transport per VirtualNetwork" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-network-k8s-manager-cudn-evpn-{{ $data | toJson | sha256sum | trunc 8 }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-operator.labels" . | nindent 4 }}
    osac.openshift.io/network-k8s-manager: "true"
immutable: true
data:
  {{- toYaml $data | nindent 2 }}
