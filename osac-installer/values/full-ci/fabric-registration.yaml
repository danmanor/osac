# Netris Fabric Manager registration (network manager contract section 4.2),
# applied by `make install-osac` after the osac chart. The admin applies the
# Fabric Manager registration; it is never a Helm value. Immutable: delete and
# recreate it to change it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-manager-netris
  labels:
    osac.openshift.io/network-fabric-manager: "true"
immutable: true
data:
  name: netris
  ansible_role: osac.templates.netris
  network_types: evpn
  capabilities: eastWestEthernet
  description: Netris Fabric Manager
