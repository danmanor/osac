# CUDN EVPN/Netris VMaaS + BMaaS E2E profile -- complete OSAC instance values.
#
# This profile is intentionally opt-in. It assumes that the cluster has the
# Phase 1 IPv4 EVPN/BGP/VTEP prerequisites, an EVPN FRRConfiguration, and a
# reachable Netris controller. Provider networking is enabled: the NetworkClass
# uses the Netris Fabric Manager (fabric-registration.yaml, applied after
# install) and the OSAC cudn_evpn Kubernetes Manager. Site-specific settings
# and the Netris password come from a private values file (see README.md).

# --- Service Enablement ---
global:
  osacDeploymentId: "ci/osac"
  fulfillmentTrust:
    enabled: false
  networking:
    provisioningEnabled: true
    fabricManager: netris
    k8sManager: cudn_evpn
    # excludedIpv4Cidrs (management, provisioning and node networks, and the
    # DNS resolvers) is site-specific: set it in the private values file.
  services:
    caas:
      enabled: false
    vmaas:
      enabled: true
    bmaas:
      enabled: true
    maas:
      enabled: false

# --- Operator ---
operator:
  image:
    repository: ghcr.io/osac-project/osac-operator
    tag: latest
    pullPolicy: Always
  aap:
    insecureSkipVerify: "true"
    tokenSecret:
      name: osac-aap-api-token
      key: token
  fulfillment:
    serverAddress: "fulfillment-internal-api:8001"
    credentials:
      secretName: fulfillment-controller-credentials
      clientIdKey: client-id
      clientSecretKey: client-secret
  controllers:
    tenant: true
    networking: true
    storage: true
  hubAccess:
    enabled: true
  tenants:
  - name: shared
  - name: osac-e2e-ci

# --- Fulfillment Service ---
service:
  variant: openshift
  externalHostname: ""  # Set dynamically by make install-osac
  internalHostname: ""  # Set dynamically by make install-osac
  images:
    service:
      repository: ghcr.io/osac-project/fulfillment-service
      tag: main
      pullPolicy: Always
    envoy:
      repository: ghcr.io/osac-project/envoy
      tag: v1.33.0
      pullPolicy: IfNotPresent
  certs:
    issuerRef:
      kind: ClusterIssuer
      name: default-ca
    caBundle:
      configMap: ca-bundle
  auth:
    # issuerUrl defaults to a global.clusterDomain-backed route URL.
    emergencyServiceAccounts:
    - admin
    - template-publisher
    - osac-metering
    controllerCredentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  idp:
    provider: keycloak
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-id
          param: client-id
        - key: client-secret
          param: client-secret
  database:
    connection:
    - secret:
        name: osac-db-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert
  log:
    level: debug
  vault:
    namespace: osac
    kvMountPath: secret
    lifecycleRole: lifecycle
    lifecycleMountPath: jwt
    keycloakClientId: osac-controller
    keycloakAudience: osac-api
    caBundle:
      configMap: ca-bundle
    credentials:
    - secret:
        name: fulfillment-controller-credentials
        items:
        - key: client-secret
          param: client-secret

# --- AAP ---
aap:
  aap:
    instance:
      enabled: true
      name: "osac-aap"
  bootstrap:
    enabled: true
    image: ghcr.io/osac-project/osac-aap:latest
    backoffLimit: 15
  configAsCode:
    manifestSecret: "config-as-code-manifest-ig"
    secret: "config-as-code-ig"
    eeImage: "ghcr.io/osac-project/osac-aap:latest"
    projectGitUri: "https://github.com/osac-project/osac"
    projectGitBranch: "main"
  instanceGroups:
    clusterFulfillment:
      enabled: true
      config:
        HOSTED_CLUSTER_CONTROLLER_AVAILABILITY_POLICY: "SingleReplica"
        HOSTED_CLUSTER_INFRASTRUCTURE_AVAILABILITY_POLICY: "SingleReplica"
    # Settings of the Netris Fabric Manager and the cudn_evpn Kubernetes
    # Manager (ConfigMap network-fulfillment-ig). The remaining site-specific
    # settings (NETRIS_VNI_RANGE, NETRIS_HUB_AS, NETRIS_DNS_RESOLVERS,
    # NETRIS_DNS_SNAT_CIDR, NETRIS_DHCP_OPTION_SET_ID, NETRIS_PROVISIONING_VNET,
    # CUDN_EVPN_DNS_RESOLVERS, ...) and secret.NETRIS_PASSWORD come from the
    # private values file.
    networkFulfillment:
      enabled: true
      config:
        NETRIS_CONTROLLER_URL: "https://redhat-ctl.netris.io"
        NETRIS_VALIDATE_CERTS: "false"
        NETRIS_USERNAME: "netris"
        NETRIS_SITE_ID: "5"
        NETRIS_TENANT_ID: "1"

# --- Validation ---
validation:
  enabled: true

# --- Bare Metal Fulfillment Operator ---
# VMaaS and BMaaS share the NetworkClass. The target cluster must
# provide Metal3/BareMetalHost inventory for the BMaaS side of the E2E test.
bmf:
  image:
    repository: ghcr.io/osac-project/bare-metal-fulfillment-operator
    tag: latest
    pullPolicy: Always
  env:
    aapUrl: "http://osac-aap/api/controller"
    aapInsecureSkipVerify: "true"
  metal3:
    enabled: true
    namespace: host-inventory
    hostClass: metal3

# --- Cluster Versions ---
clusterVersions:
  enabled: true
  versions:
  - version: "4.20.0"
    image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"
  - version: "4.22.0"
    image: "quay.io/openshift-release-dev/ocp-release:4.22.0-multi"
    default: true
    diskImage:
      name: rhcos-4-22
      sourceRef: oci://quay.io/osac-project/rhcos:4.22.0

# --- Hub Access ---
hubAccess:
  enabled: true

# --- Metering ---
metering:
  echoAdapter:
    enabled: true
    image:
      repository: ghcr.io/osac-project/metering-echo-adapter
      tag: latest
      pullPolicy: Always
  m360Adapter:
    enabled: false
    image:
      repository: ghcr.io/osac-project/metering-m360-adapter
      tag: latest
      pullPolicy: Always
    m360:
      apiUrl: "api-url"
      apiKeySecret: "m360-api-key"
      apiVersion: "v1"
  database:
    connection:
    - secret:
        name: osac-db-metering-config
        items:
        - key: url
          param: url
    - secret:
        name: osac-db-metering-client-cert
        items:
        - key: tls.crt
          param: sslcert
        - key: tls.key
          param: sslkey
        - key: ca.crt
          param: sslrootcert

# --- LVMS StorageBackend registration ---
lvms:
  enabled: true
